<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>제어반 수주 | SAMIL INSIGHT</title>
  <link rel="icon" href="./samil-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./management.css">
  <link rel="stylesheet" href="./orders.css">
</head>
<body class="orders-app">
  <aside class="sidebar">
    <a class="brand" href="./"><img class="company-logo" src="./samil-logo.svg" alt="삼일엘텍" width="66" height="51">
      <span>SAMIL <b>INSIGHT</b><small>승강기 통합 관리 시스템</small></span>
    </a>
    <div class="workspace">업무 공간 <span>제어반 수주</span></div>
    <nav aria-label="수주 업무 메뉴">
      <a href="#list" data-page="list"><span aria-hidden="true">▤</span> 수주 목록</a>
      <a href="#new" data-page="new" hidden><span aria-hidden="true">＋</span> 새 수주 등록</a>
    </nav>
    <div class="sidebar-foot"><a href="./">통합 대시보드</a></div>
  </aside>
  <div class="shell">
    <header><span>워크스페이스 <b>/</b> 제어반 수주</span>
      <div><span id="identity"></span><button class="quiet" id="orders-logout">로그아웃</button></div>
    </header>
    <main>
      <p id="order-error" class="order-error" role="alert" hidden></p>
      <div id="order-screen"><p>수주 업무를 불러오는 중입니다.</p></div>
      <footer>SAMIL ELTEC <span>승강기 제어반 수주 관리</span></footer>
    </main>
  </div>
  <dialog id="order-source" aria-labelledby="order-source-title">
    <div class="dialog-head">
      <h2 id="order-source-title">원문 근거</h2>
      <form method="dialog"><button class="quiet" aria-label="원문 닫기">닫기</button></form>
    </div>
    <div id="order-source-content"></div>
  </dialog>
  <div id="toast" role="status"></div>
  <script type="module" src="./orders.js"></script>
</body>
</html>
